openapi: 3.1.0
info:
  title: Orders API - Inconclusive Response Demo
  version: 2.0.0
  description: >-
    Local-only jury fixture containing health, profile, nested, public, and
    supported object routes. Its selected endpoint returns an ambiguous HTTP 429
    for the cross-user request, which must not be reported as a vulnerability.
servers:
  - url: http://127.0.0.1:8000
paths:
  /health:
    get:
      responses:
        '200':
          description: Service health
  /profile:
    get:
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user's profile
  /catalog:
    get:
      responses:
        '200':
          description: Public catalog
  /catalog/{product_id}:
    get:
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public product details
  /unstable-orders:
    get:
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Orders owned by the authenticated test user
  /unstable-orders/{order_id}:
    get:
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order details
        '403':
          description: Another user's order is forbidden
        '429':
          description: The authorization comparison could not be completed
  /unstable-orders/{order_id}/tracking:
    get:
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Owner-scoped shipping status
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
